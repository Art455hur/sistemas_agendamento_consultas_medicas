name: Testes e build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Testes e compilação
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_ENABLE_SUPABASE_AUTH: "false"
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
    steps:
      - name: Obter código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependências do lockfile
        run: npm ci
      - name: Executar testes unitários e de banco isolado
        run: npm test
      - name: Compilar aplicação
        run: npm run build
      - name: Instalar Chromium e dependências do navegador
        run: npm run test:e2e:install -- --with-deps
      - name: Testar interface no desktop e celular
        env:
          E2E_SERVER_MODE: production
        run: npm run test:e2e
      - name: Guardar relatório dos testes de navegador
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testes-navegador
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
